<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다크 메인 허브</title>
  <style>
    /* 1. 기본 리셋 및 다크 배경 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #0b0f19; /* 깊은 어두운 남색 */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      color: #ffffff;
    }

    /* 2. 상단 헤더 영역 */
    .header {
      text-align: center;
      margin-bottom: 50px;
    }

    .header h1 {
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      font-size: 16px;
      color: #64748b;
    }

    /* 3. 카드 컨테이너(배치) */
    .card-container {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap; /* 반응형 자동 줄바꿈 */
    }

    /* 4. 개별 카드 디자인 */
    .card {
      flex: 1;
      min-width: 250px;
      max-width: 280px;
      background: #151c2e;
      border: 1px solid #232f48;
      border-radius: 20px;
      padding: 28px 20px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
    }

    /* 카드 마우스 호버(Hover) 시 떠오름 효과 */
    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* 각 카드별 네온 포인트 색상 */
    .card-1:hover { box-shadow: 0 15px 30px rgba(59, 130, 246, 0.25); }
    .card-2:hover { box-shadow: 0 15px 30px rgba(236, 72, 153, 0.25); }
    .card-3:hover { box-shadow: 0 15px 30px rgba(16, 185, 129, 0.25); }
    .card-4:hover { box-shadow: 0 15px 30px rgba(168, 85, 247, 0.25); }

    .icon-box {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .card-1 .icon-box { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
    .card-2 .icon-box { background: rgba(236, 72, 153, 0.15); color: #ec4899; }
    .card-3 .icon-box { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .card-4 .icon-box { background: rgba(168, 85, 247, 0.15); color: #a855f7; }

    .card-content h3 {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .card-content p {
      font-size: 13.5px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .card-link {
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .card-1 .card-link { color: #60a5fa; }
    .card-2 .card-link { color: #f472b6; }
    .card-3 .card-link { color: #34d399; }
    .card-4 .card-link { color: #c084fc; }
  </style>
</head>
<body>

  <header class="header">
    <h1>원하는 서비스를 선택하세요</h1>
    <p>아래 카드 중 하나를 클릭하면 해당 서비스로 바로 이동합니다.</p>
  </header>

  <main class="card-container">
    
    <!-- 1번 카드: 구글 검색 -->
    <a href="https://google.com" target="_blank" class="card card-1">
      <div class="card-content">
        <div class="icon-box">🔍</div>
        <h3>검색 & 정보</h3>
        <p>전 세계의 다양한 최신 정보와 문서를 빠르고 정확하게 찾아보세요.</p>
      </div>
      <div class="card-link">바로가기 →</div>
    </a>

    <!-- 2번 카드: 유튜브 채널 -->
    <a href="https://www.youtube.com/@milye-7707" target="_blank" class="card card-2">
      <div class="card-content">
        <div class="icon-box">🎬</div>
        <h3>유튜브 채널</h3>
        <p>milye 채널의 최신 영상과 콘텐츠를 바로 확인해보세요.</p>
      </div>
      <div class="card-link">채널 방문하기 →</div>
    </a>

    <!-- 3번 카드: 구글 지도 -->
    <a href="https://maps.google.com" target="_blank" class="card card-3">
      <div class="card-content">
        <div class="icon-box">🗺️</div>
        <h3>지도 & 여행</h3>
        <p>추천 명소와 맛집 경로를 확인하고 나만의 일정을 계획해보세요.</p>
      </div>
      <div class="card-link">바로가기 →</div>
    </a>
    <!-- 4번 카드: 구글 드라이브 -->
   <a href="https://drive.google.com/drive/home" target="_blank" class="card card-4">
      <div class="card-content">
        <div class="icon-box">📁</div>
        <h3>구글 드라이브</h3>
        <p>내 드라이브로 바로 이동해 사진 및 파일을 안전하게 보관하고 관리하세요.</p>
      </div>
      <div class="card-link">드라이브 열기 →</div>
    </a>

  </main>

  <script>
    // JS: 카드 클릭 시 콘솔 기록
    const cards = document.querySelectorAll('.card');
    cards.forEach((card, index) => {
      card.addEventListener('click', () => {
        console.log(`${index + 1}번 카드가 클릭되어 이동합니다.`);
      });
    });
  </script>
</body>
</html>
