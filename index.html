<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trendy Glassmorphism Card</title>
  <style>
    /* 1. 기본 스타일 및 배경 설정 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a; /* 딥 다크 블루 */
      overflow: hidden;
      perspective: 1000px; /* 3D 입체감 효과 */
    }

    /* 2. 배경 빛(블러 구체) 효과 */
    .glow-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 1;
    }

    .circle-1 {
      width: 300px;
      height: 300px;
      background: #ec4899; /* 핑크 */
      top: 20%;
      left: 25%;
    }

    .circle-2 {
      width: 250px;
      height: 250px;
      background: #3b82f6; /* 블루 */
      bottom: 20%;
      right: 25%;
    }

    /* 3. 글래스모피즘(유리 느낌) 카드 */
    .card {
      position: relative;
      z-index: 2;
      width: 360px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.05); /* 투명한 흰색 */
      backdrop-filter: blur(16px); /* 뒷배경 흐림 효과 */
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15); /* 반투명 테두리 */
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      color: #ffffff;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #38bdf8;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    /* 4. 그라데이션 버튼 */
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ec4899, #3b82f6);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.6);
    }
  </style>
</head>
<body>

  <div class="glow-circle circle-1"></div>
  <div class="glow-circle circle-2"></div>

  <div class="card" id="tiltCard">
    <span class="badge">NEW FEATURE</span>
    <h2>Creative Design<br>for Future</h2>
    <p>트렌디한 웹 디자인 요소를 활용해 세련되고 직관적인 사용자 경험을 구현해보세요.</p>
    <button class="btn" id="actionBtn">자세히 알아보기</button>
  </div>

  <script>
    const card = document.getElementById('tiltCard');
    const button = document.getElementById('actionBtn');

    // 마우스 움직임에 따라 카드가 입체적으로 기울어지는 효과
    document.addEventListener('mousemove', (e) => {
      const { innerWidth, innerHeight } = window;
      const x = (e.clientX - innerWidth / 2) / (innerWidth / 2);
      const y = (e.clientY - innerHeight / 2) / (innerHeight / 2);

      // X축, Y축 최대 회전 각도 15도 적용
      card.style.transform = `rotateY(${x * 15}deg) rotateX(${-y * 15}deg)`;
    });

    // 화면 밖으로 마우스가 나갔을 때 원래 위치로 복귀
    document.addEventListener('mouseleave', () => {
      card.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });

    // 버튼 클릭 알림
    button.addEventListener('click', () => {
      alert('환영합니다! 원하는 페이지로 이동하거나 기능을 추가해보세요.');
    });
  </script>
</body>
</html>
